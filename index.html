<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Fogo Azul</title>

<style>
body{margin:0;background:#111;color:white;font-family:Arial;padding:20px}
.container{max-width:900px;margin:auto}
svg{width:100%;max-width:520px;background:white;border-radius:50%;display:block;margin:auto;overflow:visible}
.resumo{background:#f3f3f3;color:#111;padding:12px;border-radius:12px;margin-top:15px}
.mini{background:white;color:#111;padding:6px 10px;border-radius:999px;margin:5px 0;display:block;border:1px solid #ddd}
.mini svg{width:20px;height:20px;vertical-align:middle}
input{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{padding:10px 15px;margin-top:10px;border:none;border-radius:999px;background:#22c55e;color:black;font-weight:bold;cursor:pointer}
</style>
</head>

<body>

<div class="container">
<h2>Quiz Fogo Azul</h2>

<input id="nome" placeholder="Nome">
<input id="whatsapp" placeholder="WhatsApp">

<div id="app"></div>
<div id="resultadoResumo" class="resumo"></div>

<button onclick="salvar()">Finalizar e salvar</button>

<p id="statusOnline"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://ukbmrszdjqkgxmtlixlp.supabase.co";
const SUPABASE_KEY = "sb_publishable_8-Ou14CQn7kPQlFEo00f8A_ZEVgfDpu";

let supabaseClient = null;

function iniciarSupabase(){
  try{
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    document.getElementById("statusOnline").innerText = "Modo online ativo";
  }catch(e){
    document.getElementById("statusOnline").innerText = "Erro ao conectar Supabase";
  }
}

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.createElementNS(svgNS,"svg");
svg.setAttribute("viewBox","-80 -80 760 760");
document.getElementById("app").appendChild(svg);

let estado = Array(12).fill(0);
let cores = ["#000","#F00","#F80","#FD0","#06F"];

function desenhar(){
  for(let g=0;g<12;g++){
    let a1=g*30,a2=(g+1)*30;
    for(let l=0;l<5;l++){
      let p=document.createElementNS(svgNS,"path");
      p.setAttribute("d",fatia(60+l*40,100+l*40,a1,a2));
      p.setAttribute("fill","white");
      p.setAttribute("stroke","#333");
      p.onclick=()=>{
        estado[g]=(estado[g]==l+1)?l:l+1;
        desenharTudo();
      }
      svg.appendChild(p);
    }
  }
}

function fatia(r1,r2,a1,a2){
  let p1=polar(r2,a1),p2=polar(r2,a2),p3=polar(r1,a2),p4=polar(r1,a1);
  return `M${p1.x} ${p1.y} A${r2} ${r2} 0 0 1 ${p2.x} ${p2.y} L${p3.x} ${p3.y} A${r1} ${r1} 0 0 0 ${p4.x} ${p4.y} Z`;
}

function polar(r,a){
  let rad=(a-90)*Math.PI/180;
  return {x:300+r*Math.cos(rad),y:300+r*Math.sin(rad)};
}

function icone(cor){
  return `<svg viewBox="0 0 64 64"><path fill="${cor}" d="M36 4c2 6-2 10-6 14-4 4-8 8-10 14-3 8 2 18 12 20-4-3-6-6-6-12 0-7 5-12 9-17 3-4 6-8 8-13 4 5 4 11 2 17-2 6 0 12 4 16 6-4 8-10 8-16 0-10-6-18-13-23z"/></svg>`;
}

function atualizarResumo(){
  let total=estado.reduce((a,b)=>a+b,0);

  document.getElementById("resultadoResumo").innerHTML =
  "<b>Resultado Fogo Azul</b><br>" +
  estado.map((v,i)=>{
    let fogos="";
    for(let f=0;f<v;f++) fogos+=icone(cores[v-1]);
    return `<div class="mini">Etapa ${i+1}: ${fogos}</div>`;
  }).join("") +
  "<br>Soma: "+total;
}

function desenharTudo(){
  svg.innerHTML="";
  desenhar();
  atualizarResumo();
}

async function salvar(){
  if(!supabaseClient){
    alert("Modo online não ativo");
    return;
  }

  let nome=document.getElementById("nome").value;
  let whatsapp=document.getElementById("whatsapp").value;

  let {error}=await supabaseClient.from("respostas_quiz").insert([{
    nome,
    whatsapp,
    respostas:estado,
    total:estado.reduce((a,b)=>a+b,0)
  }]);

  if(error){
    alert("Erro: "+error.message);
  }else{
    alert("Salvo com sucesso");
  }
}

iniciarSupabase();
desenharTudo();
</script>

</body>
</html>
